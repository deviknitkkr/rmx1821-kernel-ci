name: build-kernel

# Builds the RMX1821 (Realme 3) kernel with a raised panel refresh rate.
# Nothing here touches the device; it only produces Image.gz.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "69 = vfp only (no PLL change), 72 = vfp + PLL 376"
        type: choice
        options: ["69", "72"]
        default: "69"

permissions:
  contents: read

jobs:
  build:
    # arm64 hosted runner: native aarch64 clang. Free for public repos.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex python3 device-tree-compiler \
            libssl-dev clang lld llvm binutils

          # Some images don't ship the target-prefixed binutils names.
          for t in as ld ar nm objcopy objdump strip elfedit; do
            command -v "aarch64-linux-gnu-$t" >/dev/null 2>&1 || \
              sudo ln -sf "$(command -v "$t")" "/usr/local/bin/aarch64-linux-gnu-$t"
          done

          echo "clang: $(clang --version | head -1)"
          echo "as:    $(aarch64-linux-gnu-as --version | head -1)"
          echo "lld:   $(ld.lld --version)"

      - name: Fetch kernel source (pinned)
        uses: actions/checkout@v4
        with:
          repository: Maanush2004/android_kernel_realme_RMX1821
          ref: 68d7a37a267743f12ac7d85054fea74564b8f7ea
          path: src
          fetch-depth: 1

      - name: Verify source baseline
        working-directory: src
        run: |
          # The M.A.P branch has moved on (it now reports 4.14.282). The phone
          # runs 4.14.235 built 2021-06-21, which is this commit. Pinning it is
          # what keeps vendor module CRCs and vermagic in the same family.
          grep -E "^SUBLEVEL" Makefile
          grep -qE "^SUBLEVEL = 235$" Makefile || {
            echo "source is not 4.14.235 — refusing to build"; exit 1; }

      - name: Patch config and panel timing
        working-directory: src
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          # Build strictness only. MTK adds `subdir-ccflags-y += -Werror` in many
          # directories (after KCFLAGS, so -Wno-error=... cannot override it) and
          # the top Makefile forces -Werror=strict-prototypes etc. clang 12 did
          # not flag those; clang 18+ does. Demote every -Werror to -Wno-error.
          # This changes no generated code, no ABI, no vermagic.
          #
          # The first expression matters: the GCC-style hyphen spelling
          # `-Werror-implicit-function-declaration` must become
          # `-Wno-error=implicit-function-declaration`; leaving it as
          # `-Wno-error-implicit-...` makes clang emit 31k
          # -Wunknown-warning-option lines, one per object.
          grep -rl --include='Makefile' --include='Kbuild' --include='*.mk' -- '-Werror' . \
            | xargs -r sed -i \
                -e 's/-Werror-\([a-zA-Z0-9_-]*\)/-Wno-error=\1/g' \
                -e 's/-Werror/-Wno-error/g'
          echo "remaining -Werror occurrences: $(grep -rl --include='Makefile' --include='Kbuild' --include='*.mk' -- '-Werror' . | wc -l)"

          # ...but keep this one as an error. clang does not let plain -Werror
          # promote "unknown warning option", and cc-option/cc-disable-warning
          # rely on exactly this flag to reject GCC-only -Wno-* options. Without
          # it, eight GCC warnings get passed to every object and each emits an
          # -Wunknown-warning-option line (~31k lines total).
          sed -i 's/-Wno-error=unknown-warning-option/-Werror=unknown-warning-option/g' Makefile
          grep -n "unknown-warning-option" Makefile

          # MTK checks in a prebuilt x86-64 scripts/dtc/dtc_overlay. On an arm64
          # runner that is "Exec format error". kbuild already builds its own
          # dtc for the host arch (HOSTCC scripts/dtc/dtc.o) and it accepts the
          # same -@ -O dtb -b 0 flags, so point cmd_dtc at that instead.
          sed -i 's#$(srctree)/scripts/dtc/dtc_overlay#$(objtree)/scripts/dtc/dtc#' \
            scripts/Makefile.lib
          grep -n "cmd_dtc =" -A2 scripts/Makefile.lib
          if grep -q "dtc_overlay" scripts/Makefile.lib; then
            echo "dtc_overlay is still referenced by Makefile.lib"; exit 1
          fi

          # The compat vDSO needs a 32-bit ARM toolchain we don't ship. It is a
          # leaf feature: disabling it changes no ABI, no exported symbol and no
          # vermagic. 32-bit apps still run via CONFIG_COMPAT.
          sed -i 's/^CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/' \
            arch/arm64/configs/RMX1821_defconfig

          F=drivers/misc/mediatek/lcm/ili9881_hd_dsi_vdo_qc_inx_zal1810/ili9881_hd_dsi_vdo_qc_inx_zal1810.c
          sed -i 's/params->dsi.vertical_frontporch = 236;/params->dsi.vertical_frontporch = 16;/' "$F"
          if [ "$VARIANT" = "72" ]; then
            sed -i 's/params->dsi.PLL_CLOCK = 360;/params->dsi.PLL_CLOCK = 376;/' "$F"
          fi

          echo "=== effective panel values ==="
          grep -nE "vertical_frontporch = |PLL_CLOCK = " "$F"
          echo "=== compat vdso ==="
          grep -n "COMPAT_VDSO" arch/arm64/configs/RMX1821_defconfig

      - name: Build Image.gz
        working-directory: src
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          # MUST be make arguments. Environment variables lose to the kernel's
          # own assignments (CC = $(CROSS_COMPILE)gcc).
          ARGS=(
            ARCH=arm64
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu
            # First line: demote things clang 18 made errors. Second line: turn
            # off the categories that only produce noise on 2018-era code
            # (-Wstrict-prototypes alone fires on nearly every function here).
            # None of these affect codegen.
            "KCFLAGS=-Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=return-type -Wno-error=macro-redefined -Wno-error=array-bounds -Wno-strict-prototypes -Wno-deprecated-non-prototype -Wno-missing-prototypes -Wno-unused-but-set-variable -Wno-address-of-packed-member -Wno-sometimes-uninitialized -Wno-enum-conversion -Wno-constant-conversion -Wno-tautological-compare"
          )

          printf '%s\n' "${ARGS[@]}"

          make O=out "${ARGS[@]}" RMX1821_defconfig

          # Keep the full log on disk, and print a short digest even on failure.
          set +e
          make O=out -j"$(nproc)" "${ARGS[@]}" Image.gz 2>&1 | tee ../build.log
          rc=${PIPESTATUS[0]}
          set -e

          echo "=== warning summary (top 15 categories) ==="
          grep -oE '\[-W[a-zA-Z0-9_,=+-]+\]' ../build.log | sort | uniq -c | sort -rn | head -15 || true
          echo "warning lines: $(grep -c 'warning:' ../build.log || true)"
          echo "error lines:   $(grep -c 'error:'   ../build.log || true)"
          if [ "$rc" -ne 0 ]; then
            echo "make failed with exit code $rc"
            exit "$rc"
          fi

          REL=$(cat out/include/config/kernel.release)
          echo "=== kernel release (expect 4.14.235-M.A.P) ==="
          echo "$REL"
          if [ "$REL" != "4.14.235-M.A.P" ]; then
            echo "release mismatch: $REL — this image must not be flashed"
            exit 1
          fi 

          echo "=== output ==="
          ls -lh out/arch/arm64/boot/Image.gz
          sha256sum out/arch/arm64/boot/Image.gz

          # Small report so the config and module ABI can be checked on-device
          # without downloading the whole build tree.
          F=drivers/misc/mediatek/lcm/ili9881_hd_dsi_vdo_qc_inx_zal1810/ili9881_hd_dsi_vdo_qc_inx_zal1810.c
          {
            echo "release: $REL"
            echo "variant: ${VARIANT:-69}"
            echo "image_sha256: $(sha256sum out/arch/arm64/boot/Image.gz | cut -d' ' -f1)"
            echo "defconfig_sha256: $(sha256sum arch/arm64/configs/RMX1821_defconfig | cut -d' ' -f1)"
            echo "--- panel timing ---"
            grep -nE "vertical_frontporch = |PLL_CLOCK = " "$F" || true
            echo "--- exported symbol CRCs (__crc_*) ---"
            nm out/vmlinux 2>/dev/null | awk '$2 ~ /^[Aa]$/ && $3 ~ /^__crc_/ {print substr($3,7), $1}' | sort || true
          } > report.txt
          wc -l report.txt
          echo "crc symbols: $(awk '/^--- exported symbol CRCs/{f=1;next} f' report.txt | wc -l)"

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ inputs.variant }}hz
          path: |
            src/out/arch/arm64/boot/Image.gz
            src/out/.config
            src/report.txt
          # .config is a dotfile; without this it is silently dropped.
          include-hidden-files: true
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Repack the freshly built kernel into the phone's *current* Magisk-patched
  # boot image. This is what would otherwise be done by hand on the phone with
  # /data/adb/magisk/magiskboot. The output is a directly flashable boot.img.
  # ---------------------------------------------------------------------------
  repack:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Download Image.gz
        uses: actions/download-artifact@v4
        with:
          name: Image-${{ inputs.variant }}hz
          path: in

      - name: Fetch pinned magiskboot
        run: |
          set -euo pipefail
          # Same Magisk version as installed on the phone (v31.1). The APK's
          # lib/arm64-v8a/libmagiskboot.so is a static executable.
          curl -fsSL -o magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v31.1/Magisk-v31.1.apk
          echo "89cefac0a318afa39fb3880c45c87b036c05bc1ebf02a7a715b7f8d7c26ac6e7  magisk.apk" \
            | sha256sum -c -
          unzip -o -j magisk.apk lib/arm64-v8a/libmagiskboot.so -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          ./magiskboot 2>&1 | head -2

      - name: Repack kernel into the Magisk boot
        run: |
          set -euo pipefail
          # Base image = the exact boot partition the phone runs today.
          curl -fsSL -o base.img \
            https://github.com/deviknitkkr/rmx1821-kernel-ci/releases/download/backup-v1/boot_current_magisk_RMX1821.img
          echo "b5c65e5975f27b44bdfdccbf999b35b503d570b14cc014bb0962f102ba7b800c  base.img" \
            | sha256sum -c -

          mkdir -p repack && cd repack
          cp ../base.img .
          ../magiskboot unpack base.img
          cp ../in/Image.gz kernel
          ../magiskboot repack base.img boot.img

          sha256sum boot.img | tee SHA256SUMS
          stat -c "size=%s" boot.img

      - name: Verify Magisk and kernel survived
        run: |
          set -euo pipefail
          mkdir -p verify && cd verify
          cp ../repack/boot.img .
          ../magiskboot unpack boot.img

          echo "--- header ---"
          ../magiskboot unpack -h boot.img

          test "$(../magiskboot cpio ramdisk.cpio 'exists .backup')" = "true"
          echo "magisk .backup: present"

          # magiskboot may recompress the kernel blob; compare contents.
          K1=$(gzip -dc kernel | sha256sum | cut -d' ' -f1)
          K2=$(gzip -dc ../in/Image.gz | sha256sum | cut -d' ' -f1)
          echo "kernel(inside)=$K1"
          echo "Image.gz     =$K2"
          test "$K1" = "$K2"

          size=$(stat -c %s boot.img)
          test "$size" -le 33554432
          echo "size=$size (<= 33554432)"

      - name: Upload flashable boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ inputs.variant }}hz-magisk
          path: |
            repack/boot.img
            repack/SHA256SUMS
          if-no-files-found: error
