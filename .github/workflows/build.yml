name: build-kernel

# Builds the RMX1821 (Realme 3) kernel with a raised panel refresh rate.
# Nothing here touches the device; it only produces Image.gz / a boot image.
#
# Toolchain: the working kernel on the phone reports
#   Linux version 4.14.235-M.A.P (nobody@android-build)
#   (Android (6052599 based on r353983c1) clang version 9.0.3 ...)
# so every build uses that same AOSP clang (r353983c) + AOSP GCC 4.9
# prebuilts, on an x86_64 host. The previous arm64-runner build used
# Ubuntu clang 18.1.3 and produced kernels that reset at the Realme logo
# both with the 69 Hz timing and with stock timing (bootloop control),
# while the boot header, DTB and ramdisk were byte-identical to the
# working backup. The compiler was the only remaining variable.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "stock=59.94, 61=vfp200, 65=vfp100, 66=vfp60, 68=vfp36, 69=vfp16, 72=vfp16+PLL376"
        type: choice
        options: ["stock", "61", "65", "66", "68", "69", "72"]
        default: "stock"

permissions:
  contents: read

env:
  CLANG_DIR: clang-r353983c
  GCC_AARCH64_DIR: aarch64-linux-android-4.9
  GCC_ARM_DIR: arm-linux-androideabi-4.9
  AOSP_PREBUILTS: https://android.googlesource.com/platform/prebuilts

jobs:
  build:
    # x86_64: the AOSP 2021 prebuilts are x86_64 Linux binaries.
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex python3 device-tree-compiler libssl-dev
          # Deliberately no distro clang/llvm/binutils: the kernel is compiled
          # with the AOSP 2021 toolchain fetched in the next step.

      - name: Fetch AOSP toolchain (clang 9.0.3 + GCC 4.9)
        run: |
          set -euo pipefail
          TC="$RUNNER_TEMP/tc"
          mkdir -p "$TC/clang" "$TC/aarch64" "$TC/arm"

          curl -fsSL \
            "$AOSP_PREBUILTS/clang/host/linux-x86/+archive/refs/heads/android10-release/${CLANG_DIR}.tar.gz" \
            | tar -xz -C "$TC/clang"
          curl -fsSL \
            "$AOSP_PREBUILTS/gcc/linux-x86/aarch64/${GCC_AARCH64_DIR}/+archive/refs/heads/android10-release.tar.gz" \
            | tar -xz -C "$TC/aarch64"
          curl -fsSL \
            "$AOSP_PREBUILTS/gcc/linux-x86/arm/${GCC_ARM_DIR}/+archive/refs/heads/android10-release.tar.gz" \
            | tar -xz -C "$TC/arm"

          for d in clang aarch64 arm; do
            echo "$TC/$d/bin" >> "$GITHUB_PATH"
          done

          echo "=== toolchain ==="
          "$TC/clang/bin/clang" --version | head -1
          "$TC/aarch64/bin/aarch64-linux-android-gcc" --version | head -1
          "$TC/arm/bin/arm-linux-androideabi-gcc" --version | head -1

      - name: Fetch kernel source (pinned)
        uses: actions/checkout@v4
        with:
          repository: Maanush2004/android_kernel_realme_RMX1821
          ref: 68d7a37a267743f12ac7d85054fea74564b8f7ea
          path: src
          fetch-depth: 1

      - name: Verify source baseline
        working-directory: src
        run: |
          # The M.A.P branch has moved on (it now reports 4.14.282). The phone
          # runs 4.14.235 built 2021-06-21, which is this commit. Pinning it is
          # what keeps vendor module CRCs and vermagic in the same family.
          grep -E "^SUBLEVEL" Makefile
          grep -qE "^SUBLEVEL = 235$" Makefile || {
            echo "source is not 4.14.235 — refusing to build"; exit 1; }

      - name: Patch panel timing
        working-directory: src
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          # Only the panel timing is changed. No Makefile/CONFIG edits:
          # clang 9.0.3 is the compiler this tree was built with, so the
          # clang-18 -Werror demotion and COMPAT_VDSO workarounds are gone
          # (the stock config has CONFIG_COMPAT_VDSO=y).
          F=drivers/misc/mediatek/lcm/ili9881_hd_dsi_vdo_qc_inx_zal1810/ili9881_hd_dsi_vdo_qc_inx_zal1810.c
          # Conservative ladder: the panel bootlooped at vfp 16, so test stock first,
          # then step down. vtotal = 1532 + vfp (vsa 4 + vbp 8 + active 1520).
          case "$VARIANT" in
            stock) VFP=236; PLL=360 ;;  # 59.94 Hz (control)
            61)    VFP=200; PLL=360 ;;  # ~61.2 Hz
            65)    VFP=100; PLL=360 ;;  # ~64.9 Hz
            66)    VFP=60;  PLL=360 ;;  # ~66.6 Hz
            68)    VFP=36;  PLL=360 ;;  # ~67.6 Hz
            69)    VFP=16;  PLL=360 ;;  # ~68.5 Hz
            72)    VFP=16;  PLL=376 ;;  # ~71.5 Hz
            *) echo "unknown variant: $VARIANT"; exit 1 ;;
          esac
          sed -i "s/params->dsi.vertical_frontporch = 236;/params->dsi.vertical_frontporch = $VFP;/" "$F"
          sed -i "s/params->dsi.PLL_CLOCK = 360;/params->dsi.PLL_CLOCK = $PLL;/" "$F"

          echo "=== effective panel values ==="
          echo "variant=$VARIANT vfp=$VFP pll=$PLL"
          grep -nE "vertical_frontporch = |PLL_CLOCK = " "$F"

          echo "=== config baseline ==="
          grep -n "COMPAT_VDSO" arch/arm64/configs/RMX1821_defconfig
          git status --short

      - name: Build Image.gz
        working-directory: src
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          # Make arguments only: environment variables lose to the kernel's
          # own assignments (CC = $(CROSS_COMPILE)gcc).
          #
          # CC/CLANG_TRIPLE/CROSS_COMPILE resolve through $GITHUB_PATH to the
          # AOSP clang-r353983c and GCC 4.9 prebuilts. LD/AR/NM/OBJCOPY...
          # default to the matching aarch64-linux-android-* binutils from
          # that GCC prebuilt, i.e. the original 2021 build's toolchain.
          ARGS=(
            ARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-android-
            CROSS_COMPILE=aarch64-linux-android-
            CROSS_COMPILE_ARM32=arm-linux-androideabi-
          )

          printf '%s\n' "${ARGS[@]}"

          make O=out "${ARGS[@]}" RMX1821_defconfig

          # Keep the full log on disk, and print a short digest even on failure.
          set +e
          make O=out -j"$(nproc)" "${ARGS[@]}" Image.gz 2>&1 | tee ../build.log
          rc=${PIPESTATUS[0]}
          set -e

          echo "=== warning summary (top 15 categories) ==="
          grep -oE '\[-W[a-zA-Z0-9_,=+-]+\]' ../build.log | sort | uniq -c | sort -rn | head -15 || true
          echo "warning lines: $(grep -c 'warning:' ../build.log || true)"
          echo "error lines:   $(grep -c 'error:'   ../build.log || true)"
          if [ "$rc" -ne 0 ]; then
            echo "make failed with exit code $rc"
            exit "$rc"
          fi

          REL=$(cat out/include/config/kernel.release)
          echo "=== kernel release (expect 4.14.235-M.A.P) ==="
          echo "$REL"
          if [ "$REL" != "4.14.235-M.A.P" ]; then
            echo "release mismatch: $REL — this image must not be flashed"
            exit 1
          fi

          echo "=== compiler recorded in the kernel banner ==="
          BANNER=$(gzip -dc out/arch/arm64/boot/Image.gz | strings | grep -m1 '^Linux version')
          echo "$BANNER"
          case "$BANNER" in
            *"clang version 9.0.3"*) echo "toolchain OK" ;;
            *) echo "unexpected compiler — refusing to publish"; exit 1 ;;
          esac

          echo "=== output ==="
          ls -lh out/arch/arm64/boot/Image.gz
          sha256sum out/arch/arm64/boot/Image.gz

          # Small report so the config and module ABI can be checked on-device
          # without downloading the whole build tree.
          F=drivers/misc/mediatek/lcm/ili9881_hd_dsi_vdo_qc_inx_zal1810/ili9881_hd_dsi_vdo_qc_inx_zal1810.c
          {
            echo "release: $REL"
            echo "variant: ${VARIANT:-stock}"
            echo "compiler: $BANNER"
            echo "image_sha256: $(sha256sum out/arch/arm64/boot/Image.gz | cut -d' ' -f1)"
            echo "defconfig_sha256: $(sha256sum arch/arm64/configs/RMX1821_defconfig | cut -d' ' -f1)"
            echo "--- panel timing ---"
            grep -nE "vertical_frontporch = |PLL_CLOCK = " "$F" || true
            echo "--- exported symbol CRCs (__crc_*) ---"
            nm out/vmlinux 2>/dev/null | awk '$2 ~ /^[Aa]$/ && $3 ~ /^__crc_/ {print substr($3,7), $1}' | sort || true
          } > report.txt
          wc -l report.txt
          echo "crc symbols: $(awk '/^--- exported symbol CRCs/{f=1;next} f' report.txt | wc -l)"

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ inputs.variant }}hz
          path: |
            src/out/arch/arm64/boot/Image.gz
            src/out/.config
            src/report.txt
          # .config is a dotfile; without this it is silently dropped.
          include-hidden-files: true
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Repack the freshly built kernel into the phone's *current* Magisk-patched
  # boot image. This is what would otherwise be done by hand on the phone with
  # /data/adb/magisk/magiskboot. The output is a directly flashable boot.img.
  # ---------------------------------------------------------------------------
  repack:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Download Image.gz
        uses: actions/download-artifact@v4
        with:
          name: Image-${{ inputs.variant }}hz
          path: in

      - name: Fetch pinned magiskboot
        run: |
          set -euo pipefail
          # Same Magisk version as installed on the phone (v31.1). The APK's
          # lib/x86_64/libmagiskboot.so is a static executable.
          curl -fsSL -o magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v31.1/Magisk-v31.1.apk
          echo "89cefac0a318afa39fb3880c45c87b036c05bc1ebf02a7a715b7f8d7c26ac6e7  magisk.apk" \
            | sha256sum -c -
          unzip -o -j magisk.apk lib/x86_64/libmagiskboot.so -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          # No args prints usage and exits nonzero; do not fail the step under pipefail.
          ./magiskboot 2>&1 | head -2 || true

      - name: Repack kernel into the Magisk boot
        run: |
          set -euo pipefail
          # Base image = the exact boot partition the phone runs today.
          curl -fsSL -o base.img \
            https://github.com/deviknitkkr/rmx1821-kernel-ci/releases/download/backup-v1/boot_current_magisk_RMX1821.img
          echo "b5c65e5975f27b44bdfdccbf999b35b503d570b14cc014bb0962f102ba7b800c  base.img" \
            | sha256sum -c -

          mkdir -p repack && cd repack
          cp ../base.img .
          ../magiskboot unpack base.img
          cp ../in/Image.gz kernel
          ../magiskboot repack base.img boot.img

          sha256sum boot.img | tee SHA256SUMS
          stat -c "size=%s" boot.img

      - name: Verify Magisk and kernel survived
        run: |
          set -euo pipefail
          mkdir -p verify && cd verify
          cp ../repack/boot.img .
          ../magiskboot unpack boot.img

          echo "--- header ---"
          ../magiskboot unpack -h boot.img

          # rc=0 only if the entry exists (this magiskboot prints nothing).
          ../magiskboot cpio ramdisk.cpio "exists .backup"
          echo "magisk .backup: present"

          # magiskboot unpack writes the raw (decompressed) kernel blob.
          K1=$(sha256sum kernel | cut -d' ' -f1)
          K2=$(gzip -dc ../in/Image.gz | sha256sum | cut -d' ' -f1)
          echo "kernel(inside)=$K1"
          echo "Image.gz     =$K2"
          test "$K1" = "$K2"

          size=$(stat -c %s boot.img)
          test "$size" -le 33554432
          echo "size=$size (<= 33554432)"

      - name: Upload flashable boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ inputs.variant }}hz-magisk
          path: |
            repack/boot.img
            repack/SHA256SUMS
          if-no-files-found: error
